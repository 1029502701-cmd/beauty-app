name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pages-functions deps
        run: cd pages-functions && npm install

      - name: Build Functions
        run: cd pages-functions && npx wrangler pages functions build --outdir dist

      - name: Build frontend
        run: |
          cd app
          npm install
          npm run build

      - name: Merge frontend into dist
        run: |
          cp -r ../app/dist/assets/* dist/assets/
          cp ../app/dist/index.html dist/index.html
          cp ../app/dist/favicon.svg dist/ 2>/dev/null || true
          cp ../app/dist/icons.svg dist/ 2>/dev/null || true
          cp ../app/dist/_curated-products.json dist/ 2>/dev/null || true
          cp ../app/dist/mock-pay.html dist/ 2>/dev/null || true

      - name: Deploy
        run: |
          cd pages-functions
          npx wrangler pages deploy ./dist --project-name=beauty-api-pages --branch=master --skip-caching
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
