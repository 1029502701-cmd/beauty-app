name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: 24

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fail fast on missing Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty. Set the repo secret CF_API_TOKEN to a valid Cloudflare API token."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Verify Cloudflare token
        run: |
          set -e
          # GET /accounts is the endpoint wrangler hits; it returns code 9109
          # ("Invalid access token") when the token was revoked/expired.
          res=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts" 2>&1) || true
          echo "$res" | head -c 400; echo
          if echo "$res" | grep -q '"success":true'; then
            echo "Cloudflare API token OK"
          else
            echo "Cloudflare API token INVALID (code 9109 = token revoked/expired)."
            echo "Regenerate a token with Pages:Edit + Zone:Read in Cloudflare, then update repo secret CF_API_TOKEN."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build Functions
        run: cd pages-functions && npx wrangler pages functions build --outdir dist

      - name: Generate _routes.json
        run: cd pages-functions && node gen-routes.js

      - name: Build frontend
        run: |
          cd app
          npm install
          npm run build

      - name: Merge frontend into dist
        run: |
          mkdir -p pages-functions/dist/assets
          cp -r app/dist/assets/* pages-functions/dist/assets/ || true
          cp app/dist/index.html pages-functions/dist/index.html || true
          cp app/dist/favicon.svg pages-functions/dist/ 2>/dev/null || true
          cp app/dist/icons.svg pages-functions/dist/ 2>/dev/null || true
          cp app/dist/_curated-products.json pages-functions/dist/ 2>/dev/null || true
          cp app/dist/share-card-template.jpg pages-functions/dist/ 2>/dev/null || true

      - name: Deploy
        run: |
          cd pages-functions
          npx wrangler pages deploy ./dist --project-name=beauty-api-pages --branch=master --skip-caching
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  cf-audit:
    runs-on: ubuntu-latest
    steps:
      - name: List Pages projects and deployments
        run: |
          echo "=== Pages projects ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/235c8c471fbed899968bedeb565015cf/pages/projects"
          echo ""
          echo "=== Latest deployments for beauty-api-pages ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/235c8c471fbed899968bedeb565015cf/pages/projects/beauty-api-pages/deployments?per_page=5"
          echo ""
          echo "=== Project details ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/235c8c471fbed899968bedeb565015cf/pages/projects/beauty-api-pages"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
